[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microscale-editor"
version = "0.2.2"
description = "Local, provenance-aware SEM/TEM real-space image editor"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<2.3", "opencv-python==4.12.0.88", "PySide6==6.9.3", "tifffile>=2024.8", "imagecodecs>=2025.3.30,<2027"]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.2.3,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
microscale-editor = "microscale.__main__:main"

[tool.setuptools.packages.find]
include = ["microscale*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
